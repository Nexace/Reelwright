name: CI
on: [push, pull_request]
jobs:
  build-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -yq ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install -y --no-progress ffmpeg ;;
          esac
      - name: Install
        run: |
          pip install -r requirements.txt
          npm install
          npx playwright install $([ "$RUNNER_OS" = Linux ] && echo --with-deps) chromium
      - name: Syntax checks
        run: |
          for f in bin/*.mjs setup.mjs tools/*.mjs tools/renderers/*.mjs projects/*/record.mjs; do node --check "$f"; done
          for f in tools/engine.js tools/layouts.js tools/from_url/film.js projects/*/film/film.js projects/*/hf/film.js; do node --check "$f"; done   # node --check takes one file
          python -m py_compile tools/*.py
      - name: "From a URL: draft a project and a theme from the local demo site (offline)"
        run: |
          u="file://$(node -e 'console.log(require("url").pathToFileURL("projects/website/site/index.html").pathname)')"
          node bin/reelwright.mjs from-url "$u" ci-site | tee -a "$GITHUB_STEP_SUMMARY"
          node bin/reelwright.mjs theme-from "$u" ci-site
          node -e 'const p=require("./projects/ci-site/project.json");if(p.lines.length<4||!p.lines.some(l=>l.id==="f1"))process.exit(1)'
          # the drafted accent (the demo site's green) must override the base theme's
          node -e 'const a=[...require("fs").readFileSync("themes/ci-site.css","utf8").matchAll(/--kit-accent:\s*([^;]+);/g)].map(m=>m[1]);console.log("accent",a);if(a.length<2||a[0]===a.at(-1))process.exit(1)'
          rm -rf projects/ci-site themes/ci-site.css
      - name: Build the example film end to end
        env: { PAGES: 2, PYTHON: python }
        run: node bin/reelwright.mjs all
      - name: Duration and frame count
        run: |
          echo "frames: $(ls projects/example/frames | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
          ffprobe -v error -show_entries format=duration:stream=codec_type,nb_frames -of compact projects/example/out/*.mp4 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Repeatability: inputs and a fresh render match the manifest; a re-render comes from the cache"
        env: { PAGES: 2, PYTHON: python }
        run: |
          node bin/reelwright.mjs verify | grep -E "PASS|FAIL" | tee -a "$GITHUB_STEP_SUMMARY"
          node bin/reelwright.mjs frames | tail -1 | tee -a "$GITHUB_STEP_SUMMARY" | grep -q ": 0 rendered in 0 shots,"
      - uses: actions/upload-artifact@v4
        with:
          name: example-film-${{ matrix.os }}
          path: projects/example/out/*.mp4
      - name: Build the HyperFrames example
        env: { PAGES: 2, PYTHON: python }
        run: node bin/reelwright.mjs all example-hf
      - name: "HyperFrames: same frames on a rebuild (within raster noise), duration matches mix.wav"
        env: { PAGES: 2, PYTHON: python }
        run: |
          cp -r projects/example-hf/frames frames-1
          node bin/reelwright.mjs frames example-hf
          python .github/framediff.py frames-1 projects/example-hf/frames frame-diff | tee -a "$GITHUB_STEP_SUMMARY"
          v=$(ffprobe -v error -select_streams v -show_entries stream=duration -of csv=p=0 projects/example-hf/out/example-hf.mp4)
          m=$(ffprobe -v error -show_entries format=duration -of csv=p=0 projects/example-hf/mix.wav)
          node -e 'const [v,m]=process.argv.slice(1).map(Number);console.log(`video ${v}s, mix.wav ${m}s`);process.exit(Math.abs(v-m)<=1/30?0:1)' "$v" "$m" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frame-diff-${{ matrix.os }}
          path: frame-diff/
      - name: "Look and feel: example-hf in two more themes and 9x16/1x1, layouts film passes QA"
        env: { PAGES: 2, PYTHON: python }
        run: |
          node bin/reelwright.mjs film example-hf --style editorial
          node bin/reelwright.mjs film example-hf --style neon
          node bin/reelwright.mjs film example-hf --formats 9x16,1x1
          node bin/reelwright.mjs all layouts-hf
          for f in projects/example-hf/out/*.mp4 projects/layouts-hf/out/*.mp4; do   # ffprobe takes one input
            ffprobe -v error -select_streams v -show_entries stream=width,height,nb_frames:format=filename,duration -of compact "$f"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Captions, languages, QA: subtitle files open, Spanish build matches its mix, qa-broken fails every gate"
        env: { PAGES: 2, PYTHON: python }
        run: |
          for f in projects/example-hf/out/example-hf.srt projects/example-hf/out/example-hf.vtt; do
            ffprobe -v error -show_entries stream=codec_name -of csv=p=0 "$f"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          node bin/reelwright.mjs all example-hf --lang es
          v=$(ffprobe -v error -select_streams v -show_entries stream=duration -of csv=p=0 projects/example-hf/out/example-hf-es.mp4)
          m=$(ffprobe -v error -show_entries format=duration -of csv=p=0 projects/example-hf/mix.wav)
          node -e 'const [v,m]=process.argv.slice(1).map(Number);console.log(`es: video ${v}s, mix.wav ${m}s`);process.exit(Math.abs(v-m)<=1/30?0:1)' "$v" "$m" | tee -a "$GITHUB_STEP_SUMMARY"
          head -4 projects/example-hf/out/example-hf-es.srt | tee -a "$GITHUB_STEP_SUMMARY"
          node bin/reelwright.mjs audio qa-broken && node bin/reelwright.mjs film qa-broken
          if node bin/reelwright.mjs qa qa-broken > qa-broken.txt; then echo "qa-broken passed QA"; exit 1; fi
          cat qa-broken.txt
          test "$(grep -c '^  FAIL' qa-broken.txt)" = 5
      - uses: actions/upload-artifact@v4
        with:
          name: example-hf-film-${{ matrix.os }}
          path: |
            projects/example-hf/out/*
            projects/layouts-hf/out/*.mp4
  colab-notebook:
    # cloud/reelwright_colab.ipynb outside Colab, on Colab's OS (Ubuntu 24.04): ./drive stands in for Google Drive. Run 1 builds the
    # example into it; the project's generated files are then wiped (a fresh VM), and run 2 must resume from Drive.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install what Colab already has (ffmpeg, rsync, Jupyter) and Chromium's system libraries
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg rsync
          pip install -q nbconvert ipykernel
          sudo npx -y playwright install-deps chromium   # Colab runs as root, so the notebook does this itself there
      - name: "Run 1: build the example into ./drive"
        env: { PAGES: 2, REELWRIGHT_DRIVE: "${{ github.workspace }}/drive", REELWRIGHT_CODE: "${{ github.workspace }}" }
        run: |
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=3000 --output run1.ipynb cloud/reelwright_colab.ipynb
          ls -l drive/projects/example/out/ | tee -a "$GITHUB_STEP_SUMMARY"
          test -s drive/projects/example/out/tidy-example.mp4
      - name: "Run 2: fresh project folder, resume from ./drive"
        env: { PAGES: 2, REELWRIGHT_DRIVE: "${{ github.workspace }}/drive", REELWRIGHT_CODE: "${{ github.workspace }}" }
        run: |
          git clean -fdXq projects/example
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=3000 --output run2.ipynb cloud/reelwright_colab.ipynb
          grep -o 'record: skipped[^"\\]*' cloud/run2.ipynb | tee -a "$GITHUB_STEP_SUMMARY"
          grep -o 'frames 0–[0-9]* done[^"\\]*' cloud/run2.ipynb | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q ': 0 rendered in 0 shots' cloud/run2.ipynb
          test -s drive/projects/example/out/tidy-example.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colab-notebook-runs
          path: |
            cloud/run*.ipynb
            drive/projects/example/out/
