<!doctype html>
<!-- A HyperFrames composition driven by the reelwright kit. tools/renderers/hyperframes.mjs renders it; the root
     timeline is KIT.start's render(t), so every timing comes from hf/kit-data.js (tools/sched.py).
     Preview in a browser: open hf/index.html#4.2 (a moment) or #play (rough real-time playback). -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="theme.css">   <!-- tools/theme.mjs: project.json "style" + brand.json -->
<style>
  /* layout only; colors, fonts and radius come from the theme's --kit-* tokens */
  body { background: var(--kit-bg); }
  /* sizes in --kit-u (px at 1080p, short side), positions in the title-safe box, so 16x9, 9x16 and 1x1 all fit */
  .big { left: var(--kit-safe-x); right: var(--kit-safe-x); top: calc(var(--kit-safe-y) + var(--kit-safe-h) / 2);
         transform: translateY(-50%); text-align: center; font-family: var(--kit-font-display);
         font-size: calc(112 * var(--kit-u)); font-weight: var(--kit-display-weight); letter-spacing: var(--kit-display-tracking);
         text-transform: var(--kit-display-case); line-height: 1.08; }
  .pulse { left: 50%; top: calc(var(--kit-safe-y) + 64 * var(--kit-u)); width: calc(26 * var(--kit-u)); height: calc(26 * var(--kit-u));
           margin-left: calc(-13 * var(--kit-u)); border-radius: 50%; background: var(--kit-accent); }
  .label { left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--kit-label-font);
           font-size: calc(22 * var(--kit-u)); letter-spacing: 2px; text-transform: uppercase; color: var(--kit-muted); }
  .logo { left: var(--kit-safe-x); right: var(--kit-safe-x); top: calc(var(--kit-safe-y) + var(--kit-safe-h) / 2);
          transform: translateY(-50%); text-align: center; white-space: nowrap; font-family: var(--kit-font-display);
          font-size: min(calc(150 * var(--kit-u)), calc(var(--kit-safe-w) / 8.5)); font-weight: var(--kit-display-weight);
          letter-spacing: var(--kit-display-tracking); text-transform: var(--kit-display-case); }
  .scene > * { position: absolute; }
  .scene { left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; }
  #sceneB { background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--kit-accent) 24%, var(--kit-bg)), var(--kit-bg) 75%); }
  .card { border-radius: var(--kit-radius); border: var(--kit-border); box-shadow: var(--kit-shadow); background: var(--kit-surface); object-fit: cover; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080"><div id="stage"></div></div>
<script src="kit-data.js"></script>   <!-- tools/sched.py: PROJECT, VO, MUSIC -->
<script src="kit/engine.js"></script> <!-- copied from tools/ by the renderer -->
<script src="kit/media.js"></script>   <!-- KIT.video, KIT.audio -->
<script src="kit/compose.js"></script> <!-- KIT.grade, KIT.mount -->
<script src="kit/shaders.js"></script> <!-- KIT.shader -->
<script src="film.js"></script>
</body>
</html>
