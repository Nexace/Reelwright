<!doctype html>
<!-- Film from a URL (tools/from_url/, copied by `reelwright from-url`): screenshots and copy in site.js + site/,
     look in theme.css (project.json "style" + brand.json drafted from the site). Preview: open hf/index.html#4.2 -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="kit/kit.css">
<link rel="stylesheet" href="theme.css">   <!-- tools/theme.mjs: project.json "style" + brand.json -->
<style>
  body { background: var(--kit-bg); background-image: var(--kit-bg-image); }
  .brand { position: absolute; left: 50%; top: 50%; font-size: calc(170 * var(--kit-u)); color: var(--kit-ink); white-space: nowrap; }
  .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080"><div id="stage"></div></div>
<script src="kit-data.js"></script>     <!-- tools/sched.py: PROJECT, VO, MUSIC -->
<script src="site.js"></script>         <!-- the capture: window.SITE -->
<script src="kit/engine.js"></script>   <!-- copied from tools/ by the renderer -->
<script src="kit/layouts.js"></script>  <!-- KIT.layout.* -->
<script src="film.js"></script>
</body>
</html>
