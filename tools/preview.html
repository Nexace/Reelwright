<!doctype html>
<!-- Live scrubber, served by tools/preview.mjs (reelwright preview). The film's own page runs in the iframe and the
     slider calls its render(t), so a frame here is the frame the renderer screenshots. ?fit=0 shows it at 100 %.
     Keys: ←/→ one frame, shift ±1 s, space plays (approximate, with mix.wav). -->
<html>
<head>
<meta charset="utf-8">
<title>reelwright preview</title>
<style>
  :root { --bg: #15161a; --panel: #1e2026; --ink: #e6e6e6; --muted: #8b8f98; --accent: #5eead4; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; display: flex;
         flex-direction: column; height: 100vh; }
  #banner { display: none; background: #7a2e1e; padding: 6px 12px; }
  #banner code { background: rgba(0,0,0,.3); padding: 1px 5px; border-radius: 4px; }
  #view { flex: 1; position: relative; overflow: hidden; min-height: 200px; }
  #film { border: 0; position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #000; }
  #ctl { background: var(--panel); padding: 8px 12px 10px; }
  #row { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
  #time { font-variant-numeric: tabular-nums; min-width: 190px; }
  #slider { flex: 1; accent-color: var(--accent); }
  #wave { display: block; width: 100%; height: 120px; cursor: pointer; }
  #legend { color: var(--muted); margin-top: 4px; }
  #legend b { font-weight: 500; }
</style>
</head>
<body>
<div id="banner">script changed: run <code>reelwright audio</code></div>
<div id="view"><iframe id="film"></iframe></div>
<div id="ctl">
  <div id="row"><button id="play">▶</button><span id="time">loading…</span><input id="slider" type="range" min="0" value="0" step="1"></div>
  <canvas id="wave"></canvas>
  <div id="legend"><b style="color:#5eead4">■</b> VO line · <b style="color:#f59e0b">|</b> SFX cue ·
    <b style="color:#666">|</b> beat / bar · <b style="color:#f43f5e">|</b> drop · ←/→ frame, shift ±1 s, space plays</div>
</div>
<script type="module">
const $ = (id) => document.getElementById(id);
const info = await (await fetch("/__project")).json();
const { width: W, height: H, fps } = info;
const film = $("film"), slider = $("slider"), wave = $("wave");
document.title = `preview · ${info.title}`;
if (sessionStorage.getItem("script-changed")) $("banner").style.display = "block";

// ── the film page, at its frame size, scaled to fit (or 1:1 with ?fit=0) ──
const fit = () => {
  const s = new URLSearchParams(location.search).get("fit") === "0" ? 1
    : Math.min($("view").clientWidth / W, $("view").clientHeight / H);
  Object.assign(film.style, { width: W + "px", height: H + "px", transform: `scale(${s})` });
};
addEventListener("resize", () => { fit(); drawWave(); });
fit();
film.src = info.page;
await new Promise((r) => film.addEventListener("load", r, { once: true }));
const win = film.contentWindow;
await win.READY;
const FILM = win.FILM, N = Math.round(FILM.DUR * fps);
slider.max = N;

let frame = 0, busy = null;
async function seek(f) {
  frame = Math.max(0, Math.min(N, Math.round(f)));
  slider.value = frame;
  location.replace("#t=" + (frame / fps).toFixed(3));
  $("time").textContent = `${(frame / fps).toFixed(3)} s · frame ${frame} / ${N}`;
  drawWave();
  busy = win.render(frame / fps);   // pvk/HF render(t) is async: it waits for image decodes
  await busy;
}
window.seek = (t) => seek(t * fps);   // for scripts: await seek(12.5)
slider.addEventListener("input", () => { stop(); seek(Number(slider.value)); });
addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault(); stop(); seek(frame + (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? fps : 1));
  } else if (e.key === " ") { e.preventDefault(); playing ? stop() : play(); }
});

// ── mix.wav waveform with VO spans, SFX cues, beats, bars and the drop ──
let audio = null, actx = null;
try {
  actx = new AudioContext();
  const r = await fetch(`/${info.dir}/mix.wav`);
  if (r.ok) audio = await actx.decodeAudioData(await r.arrayBuffer());
} catch (e) { console.warn("mix.wav:", e.message); }
const base = document.createElement("canvas");
function drawBase() {
  const w = base.width = wave.width = wave.clientWidth * devicePixelRatio, h = base.height = wave.height = wave.clientHeight * devicePixelRatio;
  const g = base.getContext("2d"), x = (t) => t / FILM.DUR * w;
  g.fillStyle = "#101114"; g.fillRect(0, 0, w, h);
  const M = FILM.MUSIC || {};
  if (M.beat) for (let k = 0, t = M.t0; t <= FILM.DUR; t = M.t0 + ++k * M.beat) {
    const bar = M.bar && Math.abs(((t - M.t0) / M.bar) - Math.round((t - M.t0) / M.bar)) < 1e-6;
    g.fillStyle = bar ? "#555" : "#2c2e34"; g.fillRect(x(t), 0, bar ? 2 : 1, h);
  }
  g.font = `${11 * devicePixelRatio}px system-ui`;
  for (const [id, v] of Object.entries(FILM.VO || {})) {
    g.fillStyle = "rgba(94,234,212,.16)"; g.fillRect(x(v.start), 0, x(v.end) - x(v.start), h);
    g.fillStyle = "#5eead4"; g.fillText(id, x(v.start) + 3, 12 * devicePixelRatio);
  }
  if (audio) {
    const d = audio.getChannelData(0), per = Math.max(1, Math.floor(d.length / w)), mid = h * 0.58;
    g.fillStyle = "#9aa3b2";
    for (let i = 0; i < w; i++) {
      let lo = 0, hi = 0;
      for (let j = i * per, e = Math.min(d.length, j + per); j < e; j++) { const s = d[j]; if (s < lo) lo = s; else if (s > hi) hi = s; }
      g.fillRect(i, mid - hi * h * 0.4, 1, Math.max(1, (hi - lo) * h * 0.4));
    }
  } else { g.fillStyle = "#8b8f98"; g.fillText("no mix.wav: run reelwright audio", 8, h * 0.6); }
  g.fillStyle = "#f59e0b";
  for (const c of FILM.cues || []) g.fillRect(x(c.t), h * 0.82, 2 * devicePixelRatio, h * 0.18);
  if (M.drop != null) { g.fillStyle = "#f43f5e"; g.fillRect(x(M.drop), 0, 2 * devicePixelRatio, h); g.fillText("drop", x(M.drop) + 4, h - 4); }
}
function drawWave() {
  if (!FILM) return;
  if (base.width !== wave.clientWidth * devicePixelRatio) drawBase();
  const g = wave.getContext("2d");
  g.drawImage(base, 0, 0);
  g.fillStyle = "#fff"; g.fillRect(frame / N * wave.width - 1, 0, 2, wave.height);
}
drawBase();
const scrub = (e) => { stop(); seek(e.offsetX / wave.clientWidth * N); };
wave.addEventListener("pointerdown", (e) => { scrub(e); wave.setPointerCapture(e.pointerId); wave.onpointermove = scrub; });
wave.addEventListener("pointerup", () => { wave.onpointermove = null; });

// ── play: mix.wav from the playhead, render(t) as fast as it keeps up ──
let playing = null;
function play() {
  if (frame >= N) frame = 0;
  const t0 = frame / fps;
  let src = null;
  if (audio) { actx.resume(); src = actx.createBufferSource(); src.buffer = audio; src.connect(actx.destination); src.start(0, t0); }
  const c0 = audio ? actx.currentTime : performance.now() / 1000, now = () => (audio ? actx.currentTime : performance.now() / 1000) - c0;
  playing = { src };
  $("play").textContent = "❚❚";
  const tick = async () => {
    if (!playing) return;
    const f = Math.round((t0 + now()) * fps);
    if (f >= N) { await seek(N); return stop(); }
    await seek(f);
    requestAnimationFrame(tick);
  };
  tick();
}
function stop() {
  if (!playing) return;
  playing.src?.stop(); playing = null; $("play").textContent = "▶";
}
$("play").addEventListener("click", () => (playing ? stop() : play()));

// ── reload on change, back at the same t ──
new EventSource("/__events").onmessage = (e) => {
  const { files } = JSON.parse(e.data);
  if (files.includes("project.json")) sessionStorage.setItem("script-changed", "1");
  if (files.some((f) => /(^|\/)(data|kit-data)\.js$/.test(f))) sessionStorage.removeItem("script-changed");   // sched ran
  location.reload();
};

const h = /t=([\d.]+)/.exec(location.hash);
await seek(h ? Number(h[1]) * fps : 0);
window.previewReady = true;
</script>
</body>
</html>
