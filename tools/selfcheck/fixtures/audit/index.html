<!doctype html>
<!-- tools/selfcheck/contrast-audit.mjs fixture: no engine, just window.render(t) / READY / FILM / VO.
     #grey 40px #777 on #666, #small 16px #888 on white and #gradt (36px bold #777 on a black→white gradient) fail contrast;
     #good passes; #late is invisible until 2 s.
     #box moves right 100 px/s for 0-2 s then stops; #fadein fades 0→1 over 0-1 s; #jump teleports at 1.5 s. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: #fff; width: 1280px; height: 720px; overflow: hidden; position: relative; font-family: sans-serif; }
  .a { position: absolute; }
  #greybg { left: 40px; top: 40px; width: 500px; height: 100px; background: #666; }
  #grey { left: 60px; top: 60px; font: 400 40px sans-serif; color: #777; }
  #good { left: 60px; top: 200px; font: 400 40px sans-serif; color: #fff; background: #111; padding: 0 10px; }
  #small { left: 60px; top: 300px; font: 400 16px sans-serif; color: #888; }
  #grad { left: 600px; top: 40px; width: 500px; height: 100px; background: linear-gradient(90deg, #000, #fff); }
  #gradt { left: 620px; top: 70px; font: 700 36px sans-serif; color: #777; white-space: nowrap; }
  #late { left: 60px; top: 400px; font: 400 40px sans-serif; color: #eee; }
  #box { left: 100px; top: 500px; width: 60px; height: 60px; background: #c33; }
  #fadein { left: 400px; top: 500px; width: 60px; height: 60px; background: #33c; }
  #jump { left: 600px; top: 500px; width: 60px; height: 60px; background: #3c3; }
</style></head><body>
<div id="greybg" class="a"></div><div id="grey" class="a">Low contrast label</div>
<div id="good" class="a">Fine text</div><div id="small" class="a">Small grey caption</div>
<div id="grad" class="a"></div><div id="gradt" class="a">Over a gradient</div>
<div id="late" class="a" style="opacity:0">Late text</div>
<div id="box" class="a"></div><div id="fadein" class="a"></div><div id="jump" class="a"></div>
<script>
window.FILM = { DUR: 4 };
window.VO = { l1: { start: 1, end: 2 }, l2: { start: 2.5, end: 3.5 } };
const $ = (id) => document.getElementById(id), c = (v, a, b) => Math.min(b, Math.max(a, v));
window.render = async (t) => {
  $("box").style.left = 100 + 100 * c(t, 0, 2) + "px";
  $("fadein").style.opacity = c(t, 0, 1);
  $("jump").style.left = (t < 1.5 ? 600 : 900) + "px";
  $("late").style.opacity = t >= 2 ? 1 : 0;
};
window.READY = Promise.resolve(true);
</script></body></html>
