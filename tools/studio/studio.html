<!doctype html>
<!-- The studio page, served by tools/studio/server.mjs (reelwright studio). Plain HTML + tools/studio/studio.js, no build.
     Player: the vendored <hyperframes-player> (vendor/hf-player/). It edits project.json / brand.json data only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>reelwright studio</title>
<style>
  :root { --bg: #15161a; --panel: #1e2026; --line: #2c2e34; --ink: #e6e6e6; --muted: #8b8f98; --accent: #5eead4; --warn: #f59e0b; --bad: #f43f5e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; height: 100vh; display: grid;
         grid-template-columns: minmax(0, 1fr) 360px; }
  button, input, select, textarea { font: inherit; color: inherit; background: #101114; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  button { cursor: pointer; background: var(--panel); } button:hover:not(:disabled) { border-color: var(--accent); } button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #062; border-color: var(--accent); font-weight: 600; }
  textarea { width: 100%; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  label { display: block; color: var(--muted); margin: 8px 0 2px; font-size: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 4px; font-weight: 600; }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; overflow-y: auto; padding: 10px; gap: 10px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); height: 100vh; overflow-y: auto; padding: 4px 14px 24px; }
  #banner { display: none; background: #7a2e1e; padding: 6px 10px; border-radius: 4px; }
  #banner.show { display: block; } #banner.ok { background: #1f4d3f; }
  #stage { display: flex; gap: 10px; align-items: flex-start; }
  #playerbox { flex: 1; min-width: 0; }
  hyperframes-player { display: block; background: #000; }
  #stillbox { width: 300px; flex: none; display: none; } #stillbox.show { display: block; }
  #stillbox img { width: 100%; display: block; border: 1px solid var(--line); background: #000; }
  #stillbox figcaption { color: var(--muted); margin-top: 2px; }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); }
  #bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  /* timeline: a label column and a lane column share row heights; the playhead lives in the lanes */
  #tl { display: grid; grid-template-columns: 64px minmax(0, 1fr); background: #101114; border: 1px solid var(--line); border-radius: 4px; user-select: none; }
  #labs div { height: 28px; line-height: 28px; padding-left: 8px; color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--line); }
  #lanes { position: relative; cursor: col-resize; touch-action: none; }
  .lane { position: relative; height: 28px; border-bottom: 1px solid var(--line); overflow: hidden; }
  .box { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 20px; font-size: 11px; cursor: pointer; }
  #tl-vo .box { background: rgba(94,234,212,.22); border: 1px solid var(--accent); color: var(--accent); }
  #tl-scenes .box { background: rgba(139,143,152,.14); border: 1px solid #555a64; color: var(--muted); }
  .box.sel { background: rgba(245,158,11,.3) !important; border-color: var(--warn) !important; color: #fff !important; }
  .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: #2c2e34; } .tick.bar { background: #666; width: 2px; }
  .tick.cue { background: var(--warn); top: 6px; bottom: 6px; width: 2px; } .tick.drop { background: var(--bad); width: 2px; }
  .tick span { position: absolute; top: 1px; left: 3px; font-size: 10px; color: var(--muted); }
  #playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }
  #log { margin: 0; background: #101114; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; height: 120px; overflow: auto; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  #log.err { border-color: var(--bad); }
  #links a { color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; } .row > input[type=range] { flex: 1; } .row > input[type=number] { width: 80px; }
  #status { color: var(--muted); margin-left: 6px; } #status.err { color: var(--bad); }
  #legend { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<main>
  <div id="banner"></div>
  <div id="stage">
    <div id="playerbox"><hyperframes-player id="film" controls></hyperframes-player></div>
    <figure id="stillbox"><img id="still" alt="still"><figcaption id="stillcap"></figcaption></figure>
  </div>
  <div id="bar">
    <span id="clock">loading…</span>
    <button id="btn-still" title="renders the film at 10 fps and keeps the frame nearest the playhead">Still at playhead</button>
    <button id="btn-sheet">Contact sheet</button>
    <button id="btn-taste">Taste</button>
    <button id="btn-embed">Embed</button>
    <span id="links"></span>
  </div>
  <div id="tl">
    <div id="labs"><div>time</div><div>scenes</div><div>VO</div><div>beats</div><div>SFX</div></div>
    <div id="lanes">
      <div class="lane" id="tl-ruler"></div><div class="lane" id="tl-scenes"></div><div class="lane" id="tl-vo"></div>
      <div class="lane" id="tl-beats"></div><div class="lane" id="tl-sfx"></div>
      <div id="playhead"></div>
    </div>
  </div>
  <div id="legend">click or drag the timeline to seek · space play/pause · ←/→ one frame · shift ±1 s · click a VO box or scene to edit it</div>
  <pre id="log">(job output appears here)</pre>
</main>
<aside>
  <h2>Selected line</h2>
  <div id="line-none" style="color:var(--muted)">click a VO box or scene on the timeline</div>
  <div id="line-form" hidden>
    <label for="sel-id">id</label><input id="sel-id" readonly>
    <label for="sel-text">text</label><textarea id="sel-text" rows="3"></textarea>
    <label for="sel-gap">gap before the line (s)</label>
    <div class="row"><input id="sel-gap-range" type="range" min="0" max="3" step="0.05"><input id="sel-gap" type="number" min="0" max="60" step="0.05"></div>
  </div>
  <div id="revoice" hidden style="margin-top:10px">
    <div id="revoice-msg" style="color:var(--warn)"></div>
    <button id="btn-audio" title="runs reelwright audio: the voice comes from edge-tts, which needs internet">script changed — re-voice (runs audio, needs network)</button>
  </div>
  <h2>Project</h2>
  <label for="style">style</label><select id="style"></select>
  <label for="title">title</label><input id="title" style="width:100%">
  <label for="fps">fps</label><input id="fps" type="number" min="1" max="240" step="1">
  <div style="margin-top:12px"><button id="save-inspector" class="primary">Save</button><span id="status"></span></div>
  <h2>project.json</h2>
  <textarea id="raw-project" rows="12" spellcheck="false"></textarea>
  <button id="save-raw-project">Save project.json</button>
  <h2>brand.json</h2>
  <textarea id="raw-brand" rows="6" spellcheck="false"></textarea>
  <button id="save-raw-brand">Save brand.json</button>
</aside>
<script src="/vendor/hf-player/hyperframes-player.global.js"></script>
<script type="module" src="/tools/studio/studio.js"></script>
</body>
</html>
